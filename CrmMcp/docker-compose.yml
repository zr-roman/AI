services:
  postgres:
    image: postgres:17
    container_name: crm-postgres
    environment:
      POSTGRES_DB: crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
    ports:
      # Если локально уже есть PostgreSQL на 5432, поменяй на "5433:5432" и порт в строках подключения
      - "5432:5432"
    volumes:
      - crm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  crm-pgdata:
