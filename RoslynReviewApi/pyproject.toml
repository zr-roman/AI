[project]
name = "roslyn-review-api"
version = "0.1.0"
description = "HTTP API over the RoslynReview MCP server: compiler-accurate C# navigation for code review"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.135",
    "mcp>=2.3,<3",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
roslyn-review-api = "roslyn_review_api.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roslyn_review_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: runs the real .NET RoslynReview server (needs ROSLYN_REVIEW_E2E_SERVER)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["roslyn_review_api", "conftest", "fake_server"]
